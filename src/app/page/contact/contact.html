<section class="contact">

    <div class="container">

        <div class="row g-4">

            <!-- LEFT -->

            <div class="col-lg-6">

                <div class="form-card">

                    <h2>

                        Contact Us

                    </h2>

                    <form [formGroup]="form" (ngSubmit)="submit()">

                        <input class="form-control" placeholder="Your Name" formControlName="name">

                        <input class="form-control" placeholder="Email" formControlName="email">

                        <input class="form-control" placeholder="Phone" formControlName="phone">

                        <textarea rows="5" class="form-control" placeholder="Message" formControlName="message">
</textarea>

                        <button type="submit">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="col-lg-6">

                <div class="map-card">

                    <h2>

                        Find Us

                    </h2>
                    <div class="embed-map-fixed">
                        <div class="embed-map-container"><iframe class="embed-map-frame" frameborder="0" scrolling="no"
                                marginheight="0" marginwidth="0"
                                src="https://maps.google.com/maps?width=600&height=400&hl=en&q=we3%20enterprisesv&t=&z=14&ie=UTF8&iwloc=B&output=embed"></iframe><a
                                href="https://brushjjaemu.net"
                                style="font-size:2px!important;color:gray!important;position:absolute;bottom:0;left:0;z-index:1;max-height:1px;overflow:hidden">Brush
                                Jjaemu</a></div>
                        <style>
                            .embed-map-fixed {
                                position: relative;
                                text-align: right;
                                width: 500px;
                                height: 400px;
                            }

                            .embed-map-container {
                                overflow: hidden;
                                background: none !important;
                                width: 500px;
                                height: 400px;
                            }

                            .embed-map-frame {
                                width: 500px !important;
                                height: 400px !important;
                            }
                        </style>
                    </div>

                </div>

            </div>

        </div>

        <!-- BELOW CARDS -->

        <div class="row g-4 mt-3">

            <div class="col-md-4">

                <div class="info-card">

                    <div class="icon">

                        <i class="bi bi-envelope"></i>

                    </div>

                    <h5>Email</h5>

                    <p>

                        hello@we3.com

                    </p>

                </div>

            </div>

            <div class="col-md-4">

                <div class="info-card">

                    <div class="icon">
                        <i class="bi bi-telephone"></i>
                    </div>

                    <h5>Phone</h5>

                    <div class="phone-list">
                        <a href="tel:+918128641593">+91 81286 41593</a>
                        <a href="tel:+917016716025">+91 70167 16025</a>
                        <a href="tel:+919662999559">+91 96629 99559</a>
                        <a href="tel:+918200336226">+91 82003 36226</a>
                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="info-card">

                    <div class="icon">

                        <i class="bi bi-geo-alt"></i>

                    </div>

                    <h5>Location</h5>

                    <p>
                        D1, raheman estate, Sanand Chowkdi, D/1, Ujala Brg, near hotel sagar, Sarkhej, Ahmedabad,
                        Sarkhej-Okaf, Gujarat 382210

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
