<section class="seller">

  <div class="container">

    <div class="heading">
      <h2>Our Best Seller</h2>
    </div>

    <div *ngIf="loading">
      Loading products...
    </div>

    <div *ngIf="!loading && errorMessage">
      {{ errorMessage }}
    </div>

    <div class="slider-wrapper" *ngIf="!loading && products.length">
      <button class="slider-arrow" type="button" (click)="scrollSlider(-1)">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="slider-track" #sliderTrack>
        <div class="slider-item" *ngFor="let item of products">
          <div class="product">
            <span class="best-seller-badge">Best Seller</span>

            <img
              [src]="item.image"
              [alt]="item.title"
            >

            <h5>
              {{ item.title }}
            </h5>

            <div class="review">
              ★★★★★
              <span>
                ({{ item.reviews }})
              </span>
            </div>

            <div class="price">
              {{ item.price }}
            </div>

            <div class="contact-icons">
              <i
                class="bi bi-whatsapp"
                (click)="openWhatsapp()"
              ></i>

              <i
                class="bi bi-envelope-fill"
                (click)="openEmail()"
              ></i>
            </div>
          </div>
        </div>
      </div>

      <button class="slider-arrow" type="button" (click)="scrollSlider(1)">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>

  </div>

</section>
